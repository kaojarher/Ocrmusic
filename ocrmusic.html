<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位光學黑膠（拍照/錄音功能完整版）</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #00e5ff;
            --text-color: #ffffff;
            --text-dim: #aaaaaa;
            --success-color: #00e676;
            --error-color: #ff5252;
            --record-color: #ff1744;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: var(--accent-color); margin-top: 0; }
        .tabs {
            display: flex;
            border-bottom: 2px solid #333;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .section-box {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .section-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .media-preview {
            width: 100%;
            max-width: 320px;
            height: 240px;
            background: #000;
            border-radius: 6px;
            margin: 10px auto;
            display: block;
            object-fit: cover;
        }

        .upload-box {
            border: 2px dashed #444;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: #1e1e1e;
        }
        .upload-box input { display: none; }

        .status-box {
            text-align: center;
            font-size: 14px;
            color: var(--success-color);
            margin: 10px 0;
            min-height: 20px;
        }
        .turntable-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        .vinyl-wrapper {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }
        .spinning {
            animation: spin 1.8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        button.action-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button.sub-btn {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button.rec-active {
            background: var(--record-color);
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>數位光學黑膠（拍照/錄音功能版）</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('read')">讀取與播放黑膠</button>
        <button class="tab-btn" onclick="switchTab('write')">製作黑膠 (拍照/錄音)</button>
    </div>

    <!-- 讀取與播放介面 -->
    <div id="readTab" class="tab-content active">
        <div class="upload-box" onclick="document.getElementById('readInput').click()">
            <p>點擊上傳黑膠 PNG 圖像</p>
            <input type="file" id="readInput" accept="image/*" onchange="decodeVinyl(event)">
        </div>
        <div id="readStatus" class="status-box"></div>
        <div class="turntable-container">
            <div id="readVinylWrapper" class="vinyl-wrapper">
                <canvas id="readCanvas" width="2048" height="2048"></canvas>
            </div>
        </div>
        <button id="manualPlayBtn" class="action-btn" style="display:none;" onclick="playPCM()">播放音訊 (黑膠旋轉)</button>
    </div>

    <!-- 寫入介面 -->
    <div id="writeTab" class="tab-content">
        <!-- 音訊來源選單 (檔案 / 麥克風錄音) -->
        <div class="section-box">
            <div class="section-title">1. 音樂來源：選擇檔案 或 現場錄音</div>
            <div class="upload-box" onclick="document.getElementById('audioInput').click()">
                <p id="audioLabel">點擊上傳音樂檔 (MP3/WAV)</p>
                <input type="file" id="audioInput" accept="audio/*" onchange="handleAudioUpload(event)">
            </div>
            <div class="btn-group">
                <button id="recBtn" class="sub-btn" onclick="toggleRecording()">🎙 開始麥克風錄音</button>
            </div>
            <div id="recStatus" style="font-size:12px; color:var(--text-dim); margin-top:5px; text-align:center;"></div>
        </div>

        <!-- 封面來源選單 (檔案 / 鏡頭拍照) -->
        <div class="section-box">
            <div class="section-title">2. 封面來源：上傳照片 或 鏡頭拍照</div>
            <div class="upload-box" onclick="document.getElementById('coverInput').click()">
                <p id="coverLabel">點擊上傳封面圖 (JPG/PNG)</p>
                <input type="file" id="coverInput" accept="image/*" onchange="handleCoverUpload(event)">
            </div>
            <div class="btn-group">
                <button class="sub-btn" onclick="startCamera()">📷 開啟攝影機</button>
                <button class="sub-btn" onclick="takePhoto()">⚡ 拍攝照片</button>
            </div>
            <video id="cameraVideo" class="media-preview" autoplay playsinline style="display:none;"></video>
        </div>

        <button class="action-btn" onclick="processAndEncodeAudio()">開始製作圓形黑膠圖檔</button>
        <div id="writeStatus" class="status-box"></div>
        <div class="turntable-container">
            <div class="vinyl-wrapper">
                <canvas id="writeCanvas" width="2048" height="2048"></canvas>
            </div>
        </div>
        <button class="action-btn" onclick="downloadVinyl()">下載圓形光學黑膠 PNG</button>
    </div>
</div>

<script>
    const BIT_SIZE = 1;
    const MAX_CAPACITY_BYTES = (2048 / BIT_SIZE) * (2048 / BIT_SIZE) / 8 - 64;
    let pcmAudioData = null;
    let pcmSampleRate = 8000;
    let audioSource = null;

    // 現場擷取的數據狀態
    let activeAudioBuffer = null; // 可為 ArrayBuffer
    let activeCoverImage = null; // 可為 Image 物件
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let cameraStream = null;

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if(tabName === 'read') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('readTab').classList.add('active');
            stopCamera();
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('writeTab').classList.add('active');
        }
    }

    // 處理音樂檔案上傳
    async function handleAudioUpload(e) {
        const file = e.target.files[0];
        if (file) {
            activeAudioBuffer = await file.arrayBuffer();
            document.getElementById('audioLabel').innerText = `✔ 音樂檔已載入: ${file.name}`;
            document.getElementById('recStatus').innerText = "";
        }
    }

    // 處理封面檔案上傳
    function handleCoverUpload(e) {
        const file = e.target.files[0];
        if (file) {
            const img = new Image();
            img.onload = () => {
                activeCoverImage = img;
                document.getElementById('coverLabel').innerText = `✔ 封面圖已載入: ${file.name}`;
            };
            img.src = URL.createObjectURL(file);
        }
    }

    // 麥克風錄音切換
    async function toggleRecording() {
        const recBtn = document.getElementById('recBtn');
        const recStatus = document.getElementById('recStatus');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    activeAudioBuffer = await blob.arrayBuffer();
                    recStatus.innerText = "✔ 錄音完成！已轉換為黑膠音訊來源。";
                    document.getElementById('audioLabel').innerText = "點擊上傳音樂檔 (MP3/WAV)";
                };

                mediaRecorder.start();
                isRecording = true;
                recBtn.classList.add('rec-active');
                recBtn.innerText = "⏹ 停止錄音";
                recStatus.innerText = "🎙 正在錄音中...";
            } catch (err) {
                alert("無法存取麥克風: " + err.message);
            }
        } else {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            recBtn.classList.remove('rec-active');
            recBtn.innerText = "🎙 開始麥克風錄音";
        }
    }

    // 開啟攝影機
    async function startCamera() {
        const video = document.getElementById('cameraVideo');
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 640 } });
            video.srcObject = cameraStream;
            video.style.display = "block";
        } catch (err) {
            alert("無法開啟攝影機: " + err.message);
        }
    }

    // 拍攝照片
    function takePhoto() {
        const video = document.getElementById('cameraVideo');
        if (!cameraStream || video.style.display === "none") {
            alert("請先開啟攝影機！");
            return;
        }

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 1024;
        tempCanvas.height = 1024;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

        const img = new Image();
        img.onload = () => {
            activeCoverImage = img;
            document.getElementById('coverLabel').innerText = "✔ 已成功使用鏡頭拍攝照片！";
            stopCamera();
        };
        img.src = tempCanvas.toDataURL('image/png');
    }

    // 關閉攝影機
    function stopCamera() {
        const video = document.getElementById('cameraVideo');
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        video.style.display = "none";
    }

    // 開始進行音訊與封面編碼
    async function processAndEncodeAudio() {
        const statusEl = document.getElementById('writeStatus');

        if (!activeAudioBuffer) {
            alert("請先選擇音樂檔或進行麥克風錄音！");
            return;
        }

        statusEl.style.color = "var(--success-color)";
        statusEl.innerText = "音訊轉碼與無損通道寫入中...";

        // 1. 音訊解碼與重採樣
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedBuffer = await audioCtx.decodeAudioData(activeAudioBuffer.slice(0));
        const duration = decodedBuffer.duration;

        const targetSampleRate = Math.max(3000, Math.floor(MAX_CAPACITY_BYTES / duration));
        pcmSampleRate = targetSampleRate;

        const offlineCtx = new OfflineAudioContext(1, Math.floor(duration * targetSampleRate), targetSampleRate);
        const source = offlineCtx.createBufferSource();
        source.buffer = decodedBuffer;
        source.connect(offlineCtx.destination);
        source.start();

        const resampledBuffer = await offlineCtx.startRendering();
        const floatData = resampledBuffer.getChannelData(0);

        const pcmLen = Math.min(floatData.length, MAX_CAPACITY_BYTES);
        const pcmBytes = new Uint8Array(pcmLen);
        for (let i = 0; i < pcmLen; i++) {
            let s = Math.max(-1, Math.min(1, floatData[i]));
            pcmBytes[i] = Math.floor((s + 1) * 127.5);
        }

        // 2. 繪製圖像與資料隱寫
        const canvas = document.getElementById('writeCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (activeCoverImage) {
            ctx.globalAlpha = 0.65;
            ctx.drawImage(activeCoverImage, 0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
        }

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        // 3. 藍色通道數據注入
        const magicKey = [0x50, 0x43, 0x4D, 0x38]; // 'PCM8'
        const bitStream = [];

        magicKey.forEach(b => { for(let i=7; i>=0; i--) bitStream.push((b>>i)&1); });
        for (let i = 31; i >= 0; i--) bitStream.push((pcmBytes.length >> i) & 1);
        for (let i = 31; i >= 0; i--) bitStream.push((targetSampleRate >> i) & 1);
        for (let i = 0; i < pcmBytes.length; i++) {
            for (let b = 7; b >= 0; b--) bitStream.push((pcmBytes[i] >> b) & 1);
        }

        for (let i = 0; i < bitStream.length; i++) {
            const pixelIdx = i * 4;
            data[pixelIdx + 2] = bitStream[i] === 1 ? 255 : 0; // Blue Channel
            data[pixelIdx + 3] = 255;
        }

        ctx.putImageData(imgData, 0, 0);
        statusEl.innerText = `黑膠合成成功！已封裝 ${(pcmLen/targetSampleRate).toFixed(1)} 秒音訊數據。`;
    }

    // 解碼黑膠檔
    function decodeVinyl(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusEl = document.getElementById('readStatus');
        const vinylWrapper = document.getElementById('readVinylWrapper');
        
        vinylWrapper.classList.remove('spinning');
        document.getElementById('manualPlayBtn').style.display = 'none';
        statusEl.innerText = "讀取圖檔數據中...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('readCanvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                setTimeout(() => {
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    
                    const headerBits = [];
                    for (let i = 0; i < 96; i++) {
                        const idx = i * 4 + 2;
                        headerBits.push(imgData[idx] > 128 ? 1 : 0);
                    }

                    let magic = "";
                    for(let i = 0; i < 4; i++) {
                        let byte = 0;
                        for(let b = 0; b < 8; b++) byte = (byte << 1) | headerBits[i*8 + b];
                        magic += String.fromCharCode(byte);
                    }

                    let fileLength = 0;
                    for(let i = 32; i < 64; i++) fileLength = (fileLength << 1) | headerBits[i];

                    let sampleRate = 0;
                    for(let i = 64; i < 96; i++) sampleRate = (sampleRate << 1) | headerBits[i];

                    if (magic !== 'PCM8' || fileLength <= 0) {
                        statusEl.style.color = "var(--error-color)";
                        statusEl.innerText = `解析失敗：無效黑膠圖檔 (Magic: ${magic})`;
                        return;
                    }

                    pcmSampleRate = sampleRate || 8000;

                    const totalDataBits = fileLength * 8;
                    const extractedBytes = new Uint8Array(fileLength);
                    let currentByte = 0, bitCount = 0, byteIdx = 0;

                    for (let i = 96; i < 96 + totalDataBits; i++) {
                        const idx = i * 4 + 2;
                        const bit = imgData[idx] > 128 ? 1 : 0;

                        currentByte = (currentByte << 1) | bit;
                        bitCount++;

                        if (bitCount === 8) {
                            extractedBytes[byteIdx] = currentByte;
                            currentByte = 0; bitCount = 0; byteIdx++;
                        }
                    }

                    pcmAudioData = extractedBytes;
                    const durationSec = (fileLength / pcmSampleRate).toFixed(1);
                    statusEl.style.color = "var(--success-color)";
                    statusEl.innerText = `解析成功！已讀取 ${durationSec} 秒音訊 (${pcmSampleRate} Hz)。`;
                    document.getElementById('manualPlayBtn').style.display = 'block';
                }, 50);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function playPCM() {
        if (!pcmAudioData) return;
        
        if (audioSource) {
            try { audioSource.stop(); } catch(e){}
        }

        const vinylWrapper = document.getElementById('readVinylWrapper');
        const statusEl = document.getElementById('readStatus');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const buffer = audioCtx.createBuffer(1, pcmAudioData.length, pcmSampleRate);
        const channelData = buffer.getChannelData(0);

        for (let i = 0; i < pcmAudioData.length; i++) {
            channelData[i] = (pcmAudioData[i] / 127.5) - 1.0;
        }

        audioSource = audioCtx.createBufferSource();
        audioSource.buffer = buffer;
        audioSource.connect(audioCtx.destination);
        
        vinylWrapper.classList.add('spinning');
        statusEl.innerText = "▶ 唱片旋轉播放中...";

        audioSource.onended = () => {
            vinylWrapper.classList.remove('spinning');
            statusEl.innerText = "⏹ 播放完畢。";
        };

        audioSource.start(0);
    }

    function downloadVinyl() {
        const canvas = document.getElementById('writeCanvas');
        const link = document.createElement('a');
        link.download = 'optical_vinyl_recorded.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>
</body>
</html>
