<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位光學黑膠（大字體高對比版）</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #121212;
            --accent-color: #ffea00; /* 高亮黃色：老花眼極易辨識 */
            --btn-bg: #00e5ff;    /* 亮青色按鈕 */
            --text-color: #ffffff;
            --text-dim: #dddddd;
            --success-color: #00ff66;
            --error-color: #ff3333;
            --record-color: #ff0055;
        }
        
        * {
            box-sizing: border-box;
            touch-action: manipulation; /* 避免雙擊縮放干擾點擊 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            font-size: 20px; /* 基礎字體放大 */
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 16px;
            border: 2px solid #333333;
            padding-bottom: 40px; /* 避免 Sony 手機底部導覽列遮擋 */
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin: 10px 0 20px 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* 大頁籤按鈕 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 8px;
            background: #222222;
            border: 2px solid #555555;
            border-radius: 12px;
            color: var(--text-color);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            min-height: 60px;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #000000;
            border-color: #ffffff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 區塊容器 */
        .section-box {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #444444;
        }

        .section-title {
            font-weight: 800;
            font-size: 22px;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        /* 大型點擊區域上傳框 */
        .upload-box {
            border: 3px dashed var(--accent-color);
            padding: 24px 12px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            background: #262626;
            margin-bottom: 12px;
        }

        .upload-box p {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        .upload-box input { display: none; }

        /* 按鈕組優化 */
        .btn-group {
            display: flex;
            flex-direction: column; /* 手機端垂直直列更易點擊 */
            gap: 12px;
            margin-top: 10px;
        }

        button.sub-btn {
            width: 100%;
            min-height: 58px;
            padding: 12px;
            background: #333333;
            border: 2px solid #aaaaaa;
            border-radius: 10px;
            color: #ffffff;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        button.action-btn {
            width: 100%;
            min-height: 64px;
            padding: 16px;
            background: var(--btn-bg);
            border: 3px solid #ffffff;
            border-radius: 12px;
            color: #000000;
            font-weight: 900;
            cursor: pointer;
            font-size: 22px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0, 229, 255, 0.4);
        }

        button.rec-active {
            background: var(--record-color);
            color: #ffffff;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.7; }
        }

        .status-box {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--success-color);
            margin: 15px 0;
            min-height: 30px;
            padding: 8px;
            background: #0d1f12;
            border-radius: 8px;
            border: 1px solid var(--success-color);
        }

        /* 黑膠唱片外觀（配合 Sony 狹長螢幕進行彈性調整） */
        .turntable-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .vinyl-wrapper {
            width: 75vw;
            height: 75vw;
            max-width: 340px;
            max-height: 340px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 234, 0, 0.3), 0 0 10px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            background: #000000;
            border: 4px solid #333333;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        .media-preview {
            width: 100%;
            max-height: 260px;
            background: #000000;
            border-radius: 10px;
            margin: 10px 0;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .spinning {
            animation: spin 1.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>光學黑膠唱片機</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('read')">讀取播放</button>
        <button class="tab-btn" onclick="switchTab('write')">製作黑膠</button>
    </div>

    <!-- 讀取與播放介面 -->
    <div id="readTab" class="tab-content active">
        <div class="upload-box" onclick="document.getElementById('readInput').click()">
            <p>📂 點擊選擇黑膠圖片</p>
            <input type="file" id="readInput" accept="image/*" onchange="decodeVinyl(event)">
        </div>
        <div id="readStatus" class="status-box">請上傳黑膠圖檔以開啟播放</div>
        
        <div class="turntable-container">
            <div id="readVinylWrapper" class="vinyl-wrapper">
                <canvas id="readCanvas" width="2048" height="2048"></canvas>
            </div>
        </div>
        
        <button id="manualPlayBtn" class="action-btn" style="display:none;" onclick="playPCM()">▶ 開始播放音樂 (黑膠旋轉)</button>
    </div>

    <!-- 寫入介面 -->
    <div id="writeTab" class="tab-content">
        <!-- 音樂來源 -->
        <div class="section-box">
            <div class="section-title">1. 音樂來源</div>
            <div class="upload-box" onclick="document.getElementById('audioInput').click()">
                <p id="audioLabel">🎵 選擇手機內的音樂檔</p>
                <input type="file" id="audioInput" accept="audio/*" onchange="handleAudioUpload(event)">
            </div>
            <div class="btn-group">
                <button id="recBtn" class="sub-btn" onclick="toggleRecording()">🎙 開始現場錄音</button>
            </div>
            <div id="recStatus" style="font-size:18px; color:var(--accent-color); margin-top:8px; text-align:center;"></div>
        </div>

        <!-- 封面來源 -->
        <div class="section-box">
            <div class="section-title">2. 唱片封面照片</div>
            <div class="upload-box" onclick="document.getElementById('coverInput').click()">
                <p id="coverLabel">🖼 選擇相簿中的照片</p>
                <input type="file" id="coverInput" accept="image/*" onchange="handleCoverUpload(event)">
            </div>
            <div class="btn-group">
                <button class="sub-btn" onclick="startCamera()">📷 開啟手機鏡頭</button>
                <button class="sub-btn" onclick="takePhoto()">⚡ 拍照作為封面</button>
            </div>
            <video id="cameraVideo" class="media-preview" autoplay playsinline style="display:none;"></video>
        </div>

        <button class="action-btn" onclick="processAndEncodeAudio()">⚡ 開始製作黑膠圖片</button>
        <div id="writeStatus" class="status-box" style="display:none;"></div>
        
        <div class="turntable-container">
            <div class="vinyl-wrapper">
                <canvas id="writeCanvas" width="2048" height="2048"></canvas>
            </div>
        </div>
        
        <button class="action-btn" style="background:var(--accent-color);" onclick="downloadVinyl()">💾 下載儲存黑膠 PNG 檔</button>
    </div>
</div>

<script>
    const BIT_SIZE = 1;
    const MAX_CAPACITY_BYTES = (2048 / BIT_SIZE) * (2048 / BIT_SIZE) / 8 - 64;
    let pcmAudioData = null;
    let pcmSampleRate = 8000;
    let audioSource = null;

    let activeAudioBuffer = null;
    let activeCoverImage = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let cameraStream = null;

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if(tabName === 'read') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('readTab').classList.add('active');
            stopCamera();
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('writeTab').classList.add('active');
        }
    }

    async function handleAudioUpload(e) {
        const file = e.target.files[0];
        if (file) {
            activeAudioBuffer = await file.arrayBuffer();
            document.getElementById('audioLabel').innerText = `✔ 已載入音樂: ${file.name}`;
            document.getElementById('recStatus').innerText = "";
        }
    }

    function handleCoverUpload(e) {
        const file = e.target.files[0];
        if (file) {
            const img = new Image();
            img.onload = () => {
                activeCoverImage = img;
                document.getElementById('coverLabel').innerText = `✔ 已載入照片: ${file.name}`;
            };
            img.src = URL.createObjectURL(file);
        }
    }

    async function toggleRecording() {
        const recBtn = document.getElementById('recBtn');
        const recStatus = document.getElementById('recStatus');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    activeAudioBuffer = await blob.arrayBuffer();
                    recStatus.innerText = "✔ 錄音完成！已準備好合成黑膠。";
                    document.getElementById('audioLabel').innerText = "🎵 選擇手機內的音樂檔";
                };

                mediaRecorder.start();
                isRecording = true;
                recBtn.classList.add('rec-active');
                recBtn.innerText = "⏹ 停止錄音";
                recStatus.innerText = "🎙 正在錄音中...";
            } catch (err) {
                alert("無法開啟麥克風，請檢查手機權限。");
            }
        } else {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            recBtn.classList.remove('rec-active');
            recBtn.innerText = "🎙 開始現場錄音";
        }
    }

    async function startCamera() {
        const video = document.getElementById('cameraVideo');
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = cameraStream;
            video.style.display = "block";
        } catch (err) {
            alert("無法開啟手機鏡頭，請檢查權限。");
        }
    }

    function takePhoto() {
        const video = document.getElementById('cameraVideo');
        if (!cameraStream || video.style.display === "none") {
            alert("請先點擊『開啟手機鏡頭』！");
            return;
        }

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 1024;
        tempCanvas.height = 1024;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

        const img = new Image();
        img.onload = () => {
            activeCoverImage = img;
            document.getElementById('coverLabel').innerText = "✔ 已成功使用鏡頭拍攝照片！";
            stopCamera();
        };
        img.src = tempCanvas.toDataURL('image/png');
    }

    function stopCamera() {
        const video = document.getElementById('cameraVideo');
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        video.style.display = "none";
    }

    async function processAndEncodeAudio() {
        const statusEl = document.getElementById('writeStatus');
        statusEl.style.display = "block";

        if (!activeAudioBuffer) {
            alert("請先選擇音樂檔或進行現場錄音！");
            return;
        }

        statusEl.innerText = "⏳ 正在處理音訊與寫入數據...";

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedBuffer = await audioCtx.decodeAudioData(activeAudioBuffer.slice(0));
        const duration = decodedBuffer.duration;

        const targetSampleRate = Math.max(3000, Math.floor(MAX_CAPACITY_BYTES / duration));
        pcmSampleRate = targetSampleRate;

        const offlineCtx = new OfflineAudioContext(1, Math.floor(duration * targetSampleRate), targetSampleRate);
        const source = offlineCtx.createBufferSource();
        source.buffer = decodedBuffer;
        source.connect(offlineCtx.destination);
        source.start();

        const resampledBuffer = await offlineCtx.startRendering();
        const floatData = resampledBuffer.getChannelData(0);

        const pcmLen = Math.min(floatData.length, MAX_CAPACITY_BYTES);
        const pcmBytes = new Uint8Array(pcmLen);
        for (let i = 0; i < pcmLen; i++) {
            let s = Math.max(-1, Math.min(1, floatData[i]));
            pcmBytes[i] = Math.floor((s + 1) * 127.5);
        }

        const canvas = document.getElementById('writeCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (activeCoverImage) {
            ctx.globalAlpha = 0.65;
            ctx.drawImage(activeCoverImage, 0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
        }

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        const magicKey = [0x50, 0x43, 0x4D, 0x38]; // 'PCM8'
        const bitStream = [];

        magicKey.forEach(b => { for(let i=7; i>=0; i--) bitStream.push((b>>i)&1); });
        for (let i = 31; i >= 0; i--) bitStream.push((pcmBytes.length >> i) & 1);
        for (let i = 31; i >= 0; i--) bitStream.push((targetSampleRate >> i) & 1);
        for (let i = 0; i < pcmBytes.length; i++) {
            for (let b = 7; b >= 0; b--) bitStream.push((pcmBytes[i] >> b) & 1);
        }

        for (let i = 0; i < bitStream.length; i++) {
            const pixelIdx = i * 4;
            data[pixelIdx + 2] = bitStream[i] === 1 ? 255 : 0;
            data[pixelIdx + 3] = 255;
        }

        ctx.putImageData(imgData, 0, 0);
        statusEl.innerText = `✔ 黑膠製作完成！已儲存 ${(pcmLen/targetSampleRate).toFixed(1)} 秒音訊。`;
    }

    function decodeVinyl(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusEl = document.getElementById('readStatus');
        const vinylWrapper = document.getElementById('readVinylWrapper');
        
        vinylWrapper.classList.remove('spinning');
        document.getElementById('manualPlayBtn').style.display = 'none';
        statusEl.innerText = "⏳ 正在讀取黑膠數據...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('readCanvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                setTimeout(() => {
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    
                    const headerBits = [];
                    for (let i = 0; i < 96; i++) {
                        const idx = i * 4 + 2;
                        headerBits.push(imgData[idx] > 128 ? 1 : 0);
                    }

                    let magic = "";
                    for(let i = 0; i < 4; i++) {
                        let byte = 0;
                        for(let b = 0; b < 8; b++) byte = (byte << 1) | headerBits[i*8 + b];
                        magic += String.fromCharCode(byte);
                    }

                    let fileLength = 0;
                    for(let i = 32; i < 64; i++) fileLength = (fileLength << 1) | headerBits[i];

                    let sampleRate = 0;
                    for(let i = 64; i < 96; i++) sampleRate = (sampleRate << 1) | headerBits[i];

                    if (magic !== 'PCM8' || fileLength <= 0) {
                        statusEl.style.color = "var(--error-color)";
                        statusEl.style.backgroundColor = "#2a0d0d";
                        statusEl.innerText = `❌ 解析失敗：此圖片不是有效的黑膠圖檔`;
                        return;
                    }

                    pcmSampleRate = sampleRate || 8000;

                    const totalDataBits = fileLength * 8;
                    const extractedBytes = new Uint8Array(fileLength);
                    let currentByte = 0, bitCount = 0, byteIdx = 0;

                    for (let i = 96; i < 96 + totalDataBits; i++) {
                        const idx = i * 4 + 2;
                        const bit = imgData[idx] > 128 ? 1 : 0;

                        currentByte = (currentByte << 1) | bit;
                        bitCount++;

                        if (bitCount === 8) {
                            extractedBytes[byteIdx] = currentByte;
                            currentByte = 0; bitCount = 0; byteIdx++;
                        }
                    }

                    pcmAudioData = extractedBytes;
                    const durationSec = (fileLength / pcmSampleRate).toFixed(1);
                    statusEl.style.color = "var(--success-color)";
                    statusEl.style.backgroundColor = "#0d1f12";
                    statusEl.innerText = `✔ 成功讀取音樂！長度: ${durationSec} 秒`;
                    document.getElementById('manualPlayBtn').style.display = 'block';
                }, 50);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function playPCM() {
        if (!pcmAudioData) return;
        
        if (audioSource) {
            try { audioSource.stop(); } catch(e){}
        }

        const vinylWrapper = document.getElementById('readVinylWrapper');
        const statusEl = document.getElementById('readStatus');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const buffer = audioCtx.createBuffer(1, pcmAudioData.length, pcmSampleRate);
        const channelData = buffer.getChannelData(0);

        for (let i = 0; i < pcmAudioData.length; i++) {
            channelData[i] = (pcmAudioData[i] / 127.5) - 1.0;
        }

        audioSource = audioCtx.createBufferSource();
        audioSource.buffer = buffer;
        audioSource.connect(audioCtx.destination);
        
        vinylWrapper.classList.add('spinning');
        statusEl.innerText = "▶ 唱片旋轉播放中...";

        audioSource.onended = () => {
            vinylWrapper.classList.remove('spinning');
            statusEl.innerText = "⏹ 播放完成。";
        };

        audioSource.start(0);
    }

    function downloadVinyl() {
        const canvas = document.getElementById('writeCanvas');
        const link = document.createElement('a');
        link.download = 'sony_optical_vinyl.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>
</body>
</html>
